# Incluir dentro del server { } de Nginx (ajusta la ruta root a tu carpeta landing)
types {
    application/vnd.android.package-archive apk;
}

location = /downloads/stride-lite.apk {
    add_header Content-Disposition 'attachment; filename=stride-lite.apk';
    default_type application/vnd.android.package-archive;
}
